name: Synthetic-data tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic and mathematical tests
        run: python -m unittest discover -s tests -v
      - name: Run standalone synthetic demo
        run: python examples/demo.py --output "${{ runner.temp }}/equity-alpha-demo"
      - name: Validate static dashboard data
        run: python -m json.tool showcase/data/research.json > /dev/null
